<!DOCTYPE html>
<html lang="en" data-theme="paper" data-size="standard" data-spacing="standard">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moser Mix &amp; Make</title>
    <meta
      name="description"
      content="Moser Mix & Make — Household recipes, weekly family menu, pantry & freezer list, and interactive cooking frameworks."
    />

    <!-- Custom M Monogram Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Crect x='1.5' y='1.5' width='41' height='41' rx='9' fill='%23FDFBF7' stroke='%23BFB5A4' stroke-width='2'/%3E%3Cpath d='M31 1.5 H36 C39.5 1.5 42.5 4.5 42.5 8 V13 L31 1.5 Z' fill='%238C4A32'/%3E%3Ctext x='21.5' y='30.5' text-anchor='middle' font-family='Georgia,serif' font-size='24' font-weight='600' fill='%231F1D1A'%3EM%3C/text%3E%3C/svg%3E"
    />

    <!-- E-Reader Typography: Literata (reading serif) + Inter (clean UI chrome) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- Top E-Reader Toolbar -->
    <header class="reader-header">
      <div class="reader-header__inner">
        <a class="brand-mark" href="#home" aria-label="Moser Mix and Make — Home">
          <svg class="brand-mark__icon" viewBox="0 0 44 44" fill="none" aria-hidden="true">
            <rect x="1.5" y="1.5" width="41" height="41" rx="9" fill="var(--bg-surface)" stroke="var(--rule-strong)" stroke-width="1.8" />
            <path d="M31 1.5 H36 C39.5 1.5 42.5 4.5 42.5 8 V13 L31 1.5 Z" fill="var(--accent)" />
            <text x="21.5" y="30.5" text-anchor="middle" font-family="Literata, Georgia, serif" font-size="24" font-weight="600" fill="var(--ink-primary)">M</text>
          </svg>
          <span>Moser Mix &amp; Make</span>
        </a>

        <nav class="top-nav" aria-label="Main navigation">
          <a class="top-nav__link" href="#home" data-nav="home">Home</a>
          <a class="top-nav__link" href="#menu" data-nav="menu">
            <span>Menu</span>
            <span class="nav-count-badge" data-menu-count hidden>0</span>
          </a>
          <a class="top-nav__link" href="#recipes" data-nav="recipes">Recipes</a>
          <a class="top-nav__link" href="#pantry" data-nav="pantry">Pantry</a>
          <a class="top-nav__link" href="#frameworks" data-nav="frameworks">Frameworks</a>
          <a class="top-nav__link" href="#import" data-nav="import">Import</a>
        </nav>

        <!-- Kindle-style Aa Display Settings -->
        <div class="reader-controls">
          <button
            type="button"
            id="aa-toggle"
            class="aa-button"
            aria-expanded="false"
            aria-controls="aa-popover"
            title="Display settings"
          >
            Aa
          </button>

          <div id="aa-popover" class="aa-popover" role="dialog" aria-label="Display settings" hidden>
            <div class="aa-popover__header">
              <span class="aa-popover__title">Display Settings</span>
            </div>

            <div class="aa-group">
              <span class="aa-group__label">Page Theme</span>
              <div class="aa-segment">
                <button type="button" class="aa-option" data-pref-group="theme" data-pref-value="paper">
                  <span class="aa-theme-swatch aa-theme-swatch--paper" aria-hidden="true"></span>Paper
                </button>
                <button type="button" class="aa-option" data-pref-group="theme" data-pref-value="sepia">
                  <span class="aa-theme-swatch aa-theme-swatch--sepia" aria-hidden="true"></span>Sepia
                </button>
                <button type="button" class="aa-option" data-pref-group="theme" data-pref-value="night">
                  <span class="aa-theme-swatch aa-theme-swatch--night" aria-hidden="true"></span>Night
                </button>
              </div>
            </div>

            <div class="aa-group">
              <span class="aa-group__label">Text Size</span>
              <div class="aa-segment">
                <button type="button" class="aa-option" data-pref-group="size" data-pref-value="compact">A−</button>
                <button type="button" class="aa-option" data-pref-group="size" data-pref-value="standard">Standard</button>
                <button type="button" class="aa-option" data-pref-group="size" data-pref-value="large">A+</button>
              </div>
            </div>

            <div class="aa-group">
              <span class="aa-group__label">Line Spacing</span>
              <div class="aa-segment">
                <button type="button" class="aa-option" data-pref-group="spacing" data-pref-value="compact">Compact</button>
                <button type="button" class="aa-option" data-pref-group="spacing" data-pref-value="standard">Standard</button>
                <button type="button" class="aa-option" data-pref-group="spacing" data-pref-value="relaxed">Relaxed</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content Stage -->
    <main id="reader-stage" class="reader-stage" aria-live="polite"></main>

    <!-- Quiet Footer -->
    <footer class="reader-footer">
      <div class="reader-footer__inner">
        <span id="footer-section">Home</span>
        <span>Moser Mix &amp; Make · Theme Prototype v0.2</span>
      </div>
    </footer>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="mobile-nav" aria-label="Mobile navigation">
      <a class="mobile-nav__link" href="#home" data-nav="home">
        <svg class="mobile-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 10.5L12 3l9 7.5" />
          <path d="M5 9.5V20h14V9.5" />
        </svg>
        <span>Home</span>
      </a>
      <a class="mobile-nav__link" href="#menu" data-nav="menu">
        <svg class="mobile-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <path d="M8 9h8M8 13h5" />
        </svg>
        <span>Menu</span>
      </a>
      <a class="mobile-nav__link" href="#recipes" data-nav="recipes">
        <svg class="mobile-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v18H6.5A2.5 2.5 0 0 1 4 18.5z" />
          <path d="M8 7h8M8 11h6" />
        </svg>
        <span>Recipes</span>
      </a>
      <a class="mobile-nav__link" href="#pantry" data-nav="pantry">
        <svg class="mobile-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" />
          <circle cx="8" cy="7" r="1" fill="currentColor" />
          <circle cx="15" cy="12" r="1" fill="currentColor" />
          <circle cx="11" cy="17" r="1" fill="currentColor" />
        </svg>
        <span>Pantry</span>
      </a>
      <a class="mobile-nav__link" href="#frameworks" data-nav="frameworks">
        <svg class="mobile-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3" />
          <path d="M1 14h6M9 8h6M17 16h6" />
        </svg>
        <span>Tools</span>
      </a>
      <a class="mobile-nav__link" href="#import" data-nav="import">
        <svg class="mobile-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
          <circle cx="12" cy="13" r="3.5" />
        </svg>
        <span>Import</span>
      </a>
    </nav>

    <script src="js/sample-data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
